server:
  port: 8080

spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:cloud-back-server/.env[.properties]
  application:
    name: cloud-back-server

# JWT 설정 (auth-back-server와 동일한 secret 사용)
app:
  jwt:
    secret: ${CLOUD_JWT_SECRET}
  security:
    issuer: ${AUTH_ISSUER:http://localhost:9000}
  cors:
    allowed-origins: ${CLOUD_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002,http://localhost:3003,http://127.0.0.1:3003,http://localhost:3005,http://127.0.0.1:3005}

gateway:
  auth:
    shared-secret: ${ZEROQ_GATEWAY_SHARED_SECRET:}
    allowed-clock-skew-seconds: ${ZEROQ_GATEWAY_ALLOWED_CLOCK_SKEW_SECONDS:300}

stock:
  batch:
    internal:
      token: ${STOCK_BATCH_INTERNAL_TOKEN}

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info
